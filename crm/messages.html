<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Messages · Front desk</title>


  <link rel="stylesheet" href="./assets/fonts/fonts.css" />
  <link rel="stylesheet" href="./assets/crm.css" />
</head>

<body>
  <header data-masthead></header>

  <main>
    <section class="fn" id="messages">
      <div class="fn-head">
        <p class="eyebrow">What went out</p>
        <h2>Messages</h2>
        <p class="fn-note">
          Every message the system sent and exactly what it said. Anything
          that failed is flagged — a confirmation nobody received is worse
          than none at all.
        </p>
        <p class="fn-tally"><b data-count="messages">·</b> sent</p>
      </div>

      <div class="fn-body" data-list="messages">
        <p class="empty">Nothing sent yet.</p>
      </div>
    </section>
  </main>

  <footer class="foot"><span data-source>—</span></footer>

  <script type="module" src="./assets/js/pages/messages.js"></script>
</body>

</html>
