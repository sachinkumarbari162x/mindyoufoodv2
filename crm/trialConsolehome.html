<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Front desk</title>

  <!-- ============================================================
       A SIGNPOST. THE TRIAL WON.

       This was the console trial, one of three homes built to be
       compared. It is now the home: index.html, the entry the nav
       points at, and the only front door there is.

       The file stays so an address typed from memory still lands
       somewhere correct, and so nothing that ever linked here
       breaks. It holds no markup of its own — a second copy of a
       live page is a copy that drifts, and then two screens
       disagree about what the practice looks like.
       ============================================================ -->
  <meta http-equiv="refresh" content="0; url=./index.html" />
  <link rel="canonical" href="./index.html" />
</head>

<body>
  <p>The console is now the front desk's home — <a href="./index.html">open it</a>.</p>
  <script>location.replace("./index.html");</script>
</body>

</html>
